    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #151515 0%,
                    #080808 45%,
                    #000000 100%
                );

            font-family: Georgia, serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =====================================
           ESTRELLAS
        ===================================== */

        .estrellas {

            position: fixed;

            inset: 0;

            pointer-events: none;

        }


        .estrella {

            position: absolute;

            width: 3px;

            height: 3px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 6px white;

            animation:
                parpadear 2s infinite alternate;

        }


        .e1 {
            top: 8%;
            left: 12%;
            animation-delay: .2s;
        }

        .e2 {
            top: 18%;
            left: 28%;
            animation-delay: 1s;
        }

        .e3 {
            top: 10%;
            left: 48%;
            animation-delay: .5s;
        }

            top: 22%;
            left: 67%;

        }

        .e5 {
            top: 7%;
            left: 87%;

        }

        .e6 {
            top: 35%;
            left: 8%;
            animation-delay: 1.7s;
        }

        .e7 {
            top: 40%;
            left: 22%;
            animation-delay: .4s;
        }

        .e8 {
            top: 32%;
            left: 82%;
            animation-delay: 1.1s;
        }

        .e9 {
            top: 55%;
            left: 6%;
            animation-delay: .7s;
        }

        .e10 {
            top: 63%;
            left: 18%;
            animation-delay: 1.5s;
        }

        .e11 {
            top: 72%;
            left: 82%;
            animation-delay: .3s;
        }

        .e12 {
            top: 84%;
            left: 30%;
            animation-delay: 1.2s;
        }

        .e13 {
            top: 76%;
            left: 55%;
            animation-delay: .6s;
        }

        .e14 {
            top: 90%;
            left: 75%;
            animation-delay: 1.8s;
        }

        .e15 {
            top: 48%;
            left: 94%;
            animation-delay: .9s;
        }


        @keyframes parpadear {

            0% {
                opacity: .15;

                transform: scale(.5);
            }

            50% {
                opacity: .7;
            }

            100% {
                opacity: 1;

                transform: scale(1.5);
            }

        }


        /* =====================================
           CONTENIDO
        ===================================== */

        .contenido {

            position: relative;

            z-index: 5;

            text-align: center;

            width: 100%;

            animation:
                aparecer 2s ease;

        }


        .titulo {

            font-size: 30px;

            font-weight: normal;

            color: #fff4b0;

            margin-bottom: 15px;

            text-shadow:
                0 0 15px rgba(255, 220, 70, .4);

        }


        .subtitulo {

            font-size: 17px;

            color: #aaa;

            font-style: italic;

            margin-bottom: 10px;

        }


        /* =====================================
           RAMO
        ===================================== */

        .ramo {

            position: relative;

            width: 430px;

            height: 500px;

            margin: auto;

            animation:
                ramoAparecer 3s ease;

        }


        /* =====================================
           TALLOS
        ===================================== */

        .tallo {

            position: absolute;

            width: 9px;

            height: 330px;

            left: 50%;

            bottom: 25px;

            background:
                linear-gradient(
                    90deg,
                    #173719,
                    #47783c,
                    #173719
                );

            border-radius: 10px;

            transform-origin: bottom;

        }


        .tallo1 {
            transform: rotate(-28deg);
        }

        .tallo2 {
            transform: rotate(-14deg);
        }

        .tallo3 {
            transform: rotate(-5deg);
        }

        .tallo4 {
            transform: rotate(8deg);
        }

        .tallo5 {
            transform: rotate(20deg);
        }

        .tallo6 {
            transform: rotate(32deg);
        }


        /* =====================================
           HOJAS
        ===================================== */

        .hoja {

            position: absolute;

            width: 105px;

            height: 42px;

            background:
                linear-gradient(
                    135deg,
                    #4f8b3b,
                    #214b24
                );

            border-radius:
                100% 0 100% 0;

            box-shadow:
                inset 0 0 10px rgba(0,0,0,.3);

        }


        .hoja1 {
            left: 65px;
            bottom: 170px;
            transform: rotate(25deg);
        }

        .hoja2 {
            right: 60px;
            bottom: 210px;
            transform: rotate(-25deg);
        }

        .hoja3 {
            left: 105px;
            bottom: 100px;
            transform: rotate(15deg);
        }

        .hoja4 {
            right: 100px;
            bottom: 115px;
            transform: rotate(-20deg);
        }

        .hoja5 {
            left: 155px;
            bottom: 245px;
            transform: rotate(10deg);
        }


        /* =====================================
           GIRASOLES
        ===================================== */

        .girasol {

            position: absolute;

            width: 140px;

            height: 140px;

            filter:
                drop-shadow(
                    0 8px 12px rgba(0,0,0,.5)
                );

        }


        .g1 {
            top: 10px;
            left: 145px;
        }

        .g2 {
            top: 80px;
            left: 30px;

            transform: scale(.82);
        }

        .g3 {
            top: 80px;
            right: 30px;

            transform: scale(.82);
        }

        .g4 {
            top: 150px;
            left: 105px;

            transform: scale(.72);
        }

        .g5 {
            top: 145px;
            right: 90px;

            transform: scale(.65);
        }


        /* =====================================
           PÉTALOS
        ===================================== */

        .petalos {

            position: absolute;

            inset: 0;

        }


        .petalo {

            position: absolute;

            width: 40px;

            height: 72px;

            left: 50px;

            top: 0;

            background:
                linear-gradient(
                    90deg,
                    #d99500,
                    #ffd52e,
                    #e4a400
                );

            border-radius:
                50% 50% 45% 45%;

            transform-origin:
                20px 70px;

            box-shadow:
                0 2px 4px rgba(0,0,0,.25);

        }


        .petalo:nth-child(1) {
            transform: rotate(0deg);
        }

        .petalo:nth-child(2) {
            transform: rotate(45deg);
        }

        .petalo:nth-child(3) {
            transform: rotate(90deg);
        }

        .petalo:nth-child(4) {
            transform: rotate(135deg);
        }

        .petalo:nth-child(5) {
            transform: rotate(180deg);
        }

        .petalo:nth-child(6) {
            transform: rotate(225deg);
        }

        .petalo:nth-child(7) {
            transform: rotate(270deg);
        }

        .petalo:nth-child(8) {
            transform: rotate(315deg);
        }


        /* =====================================
           CENTRO DEL GIRASOL
        ===================================== */

        .centro {

            position: absolute;

            width: 58px;

            height: 58px;

            left: 41px;

            top: 41px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #8b531c 0%,
                    #5a3210 55%,
                    #301807 100%
                );

            box-shadow:
                inset 0 0 0 5px #42230c,
                0 0 8px rgba(0,0,0,.6);

        }


        /* =====================================
           BRILLOS ALREDEDOR DEL RAMO
        ===================================== */

        .brillo {

            position: absolute;

            width: 6px;

            height: 6px;

            background: #ffe87a;

            border-radius: 50%;

            box-shadow:
                0 0 12px #ffe87a;

            animation:
                brillo 2s infinite alternate;

        }


        .b1 {
            top: 80px;
            left: 100px;
        }

        .b2 {
            top: 150px;
            right: 100px;
            animation-delay: .5s;
        }

        .b3 {
            top: 250px;
            left: 75px;
            animation-delay: 1s;
        }

        .b4 {
            top: 280px;
            right: 70px;
            animation-delay: 1.5s;
        }


        @keyframes brillo {

            from {
                opacity: .2;

                transform: scale(.5);
            }

            to {
                opacity: 1;

                transform: scale(1.5);
            }

        }


        /* =====================================
           MENSAJE FINAL
        ===================================== */

        .mensaje {

            font-size: 21px;

            color: #ffe98a;

            font-style: italic;

            margin-top: -35px;

            opacity: 0;

            animation:
                mensajeAparecer 2s ease 2.5s forwards;

            text-shadow:
                0 0 10px rgba(255,220,70,.3);

        }


        /* =====================================
           ANIMACIONES PRINCIPALES
        ===================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        @keyframes ramoAparecer {

            from {

                opacity: 0;

                transform:
                    translateY(80px)
                    scale(.7);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes mensajeAparecer {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================
           CELULARES
        ===================================== */

        @media (max-width: 600px) {

            .titulo {

            }

            }

                margin-bottom: -60px;

                font-size: 17px;

                margin-top: -20px;

            }

        }

    </style>

</head>
